  spring:
    application:
      name: api-gateway

    #api gateway config
    cloud:
      gateway:
        server:
          webmvc:
            routes:
              - id: order-service
                uri: lb://ORDER-SERVICE
                predicates:
#                  - Path=/orders/**
                  - Path=/api/v1/orders/**
                filters:
                  - StripPrefix=2
#                  - RedirectTo=302, http://codingshuttle.com
              - id: inventory-service
                uri: lb://INVENTORY-SERVICE
                predicates:
#                  - Path=/inventory/**
                  - Path=/api/v1/inventory/**
                filters:
                  - StripPrefix=2
#                  - RedirectTo=302, http://codingshuttle.com
  eureka:
    client:
      service-url:
        defaultZone: http://localhost:8761/eureka
